apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crud-app
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  ingressClassName: traefik
  tls:
    - secretName: crud-tls
      hosts: [crud.lab.test]
  rules:
    - host: crud.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crud-app
                port: {name: http}
