apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitors.yaml
  - podmonitors.yaml
  - alerts.yaml

# Dashboardy Grafany: pliki JSON -> ConfigMap z labelem grafana_dashboard=1 (sidecar Grafany)
configMapGenerator:
  - name: dashboard-crud-overview
    namespace: monitoring
    files:
      - dashboards/crud-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Lab
