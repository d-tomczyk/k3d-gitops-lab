# Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter, Prometheus Operator (+ CRD)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.3.0
      helm:
        releaseName: kps
        valueFiles:
          - $values/gitops/kube-prometheus-stack/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitea-admin/k3d-gitops-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # CRD Prometheus Operatora są za duże na client-side apply
    retry:
      limit: -1
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
