# argo/argo-cd 10.10.2 (Argo CD v3.5.4)
global:
  domain: argocd.lab.test

configs:
  params:
    server.insecure: true          # TLS kończy Traefik
  cm:
    timeout.reconciliation: 60s    # Gitea bez webhooka — częstsze odpytywanie repo
    admin.enabled: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: lab-ca
    tls: true                      # Secret argocd-server-tls wystawia cert-manager
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 192Mi}

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

repoServer:
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 384Mi}

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}

# Niepotrzebne w labie — oszczędność RAM
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
