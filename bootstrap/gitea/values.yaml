# gitea-charts/gitea 12.7.0 (Gitea 1.27.0)
# Lekka instalacja: SQLite, cache/sesje w pamięci, bez postgresql-ha i valkey-cluster.
replicaCount: 1
strategy:
  type: Recreate          # PVC RWO + SQLite — nie może działać obok starej repliki

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
  hosts:
    - host: gitea.lab.test
      paths:
        - path: /
  tls:
    - secretName: gitea-tls
      hosts: [gitea.lab.test]

persistence:
  enabled: true
  size: 2Gi

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 384Mi}

initContainers:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

gitea:
  admin:
    existingSecret: gitea-admin     # klucze: username, password (tworzy bootstrap/Ansible)
    email: admin@lab.test
    passwordMode: keepUpdated
  metrics:
    enabled: true                    # /metrics bez tokenu (lab); ServiceMonitor w gitops/monitoring-config
  config:
    server:
      DOMAIN: gitea.lab.test
      ROOT_URL: https://gitea.lab.test/
      DISABLE_SSH: true
    database:
      DB_TYPE: sqlite3
    cache:
      ADAPTER: memory
    session:
      PROVIDER: memory
    queue:
      TYPE: level
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: false
    service:
      DISABLE_REGISTRATION: true
    repository:
      DEFAULT_BRANCH: main
    metrics:
      ENABLED: true

valkey-cluster:
  enabled: false
valkey:
  enabled: false
postgresql-ha:
  enabled: false
postgresql:
  enabled: false

test:
  enabled: false
