# Obciążenie dla testu HPA — uruchamiane przez tests/hpa-test.sh (make test-hpa), poza Argo CD.
# Ręcznie: kubectl apply -f tests/hpa-load.yaml; kubectl -n crud get hpa crud-app -w; kubectl delete -f tests/hpa-load.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpa-load
  namespace: crud
data:
  script.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      scenarios: {
        burn: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '30s', target: 10 },
            { duration: '3m', target: 10 },
            { duration: '20s', target: 0 },
          ],
        },
      },
    };

    const BASE = 'http://crud-app.crud.svc.cluster.local';

    export default function () {
      // mieszanka: obciążenie CPU + zwykły CRUD
      check(http.get(`${BASE}/burn?ms=40`), { 'burn 200': (r) => r.status === 200 });
      const created = http.post(`${BASE}/items`, JSON.stringify({ name: `k6-${__VU}-${__ITER}` }),
        { headers: { 'Content-Type': 'application/json' } });
      check(created, { 'create 201': (r) => r.status === 201 });
      if (created.status === 201) {
        http.del(`${BASE}/items/${created.json('id')}`);
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-load
  namespace: crud
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: docker.io/grafana/k6:1.8.1
          args: [run, /scripts/script.js]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: script, mountPath: /scripts}
      volumes:
        - name: script
          configMap: {name: hpa-load}
