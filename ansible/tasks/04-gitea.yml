- name: Repo Helm Gitea
  kubernetes.core.helm_repository:
    name: "{{ charts.gitea.repo }}"
    repo_url: "{{ charts.gitea.url }}"

- name: Namespace gitea
  kubernetes.core.k8s:
    state: present
    definition: {apiVersion: v1, kind: Namespace, metadata: {name: gitea}}

- name: Poświadczenia admina Gitea
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: gitea-admin, namespace: gitea}
      stringData:
        username: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
  no_log: true

- name: Gitea
  kubernetes.core.helm:
    name: gitea
    chart_ref: "{{ charts.gitea.repo }}/{{ charts.gitea.chart }}"
    chart_version: "{{ charts.gitea.version }}"
    release_namespace: gitea
    values_files: ["{{ repo_dir }}/bootstrap/gitea/values.yaml"]

- name: Gitea odpowiada przez Ingress z TLS
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/healthz"
    ca_path: "{{ ca_cert_file }}"
  register: gitea_health
  until: gitea_health.status == 200
  retries: 60
  delay: 5

- name: Repozytorium {{ gitea_repo }}
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/user/repos"
    method: POST
    ca_path: "{{ ca_cert_file }}"
    url_username: "{{ gitea_admin_user }}"
    url_password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: {name: "{{ gitea_repo }}", private: true, default_branch: main}
    status_code: [201, 409]
  register: gitea_repo_create
  changed_when: gitea_repo_create.status == 201

# Wypychany jest zacommitowany HEAD lokalnego repo (niezacommitowane zmiany nie trafią do Argo CD).
# Lokalne repo jest źródłem prawdy, a Gitea jego kopią dla Argo CD — stąd --force
# (działa też po przepisaniu historii lokalnie).
- name: Push repozytorium do Gitea
  ansible.builtin.command:
    argv:
      - git
      - -c
      - "http.sslCAInfo={{ ca_cert_file }}"
      - -c
      - "http.extraHeader=Authorization: Basic {{ (gitea_admin_user ~ ':' ~ gitea_admin_password) | b64encode }}"
      - push
      - --force
      - "{{ gitea_url }}/{{ gitea_admin_user }}/{{ gitea_repo }}.git"
      - HEAD:refs/heads/main
    chdir: "{{ repo_dir }}"
  register: git_push
  changed_when: "'Everything up-to-date' not in git_push.stderr"
  no_log: true

# Token tylko do odczytu dla Argo CD; odtwarzany, jeśli Gitea go nie zna (np. po przebudowie klastra).
- name: Zapisany token Argo CD
  ansible.builtin.set_fact:
    argocd_git_token: "{{ lookup('ansible.builtin.file', secrets_dir ~ '/gitea-argocd-token', errors='ignore') | default('', true) }}"
  no_log: true

- name: Token nadal ważny?
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_user }}/{{ gitea_repo }}"
    ca_path: "{{ ca_cert_file }}"
    headers: {Authorization: "token {{ argocd_git_token }}"}
    status_code: [200, 401, 403, 404]
  register: token_check
  when: argocd_git_token | length > 0
  no_log: true

- name: Nowy token Argo CD
  when: argocd_git_token | length == 0 or token_check.status != 200
  block:
    - name: Usuń stary token
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/users/{{ gitea_admin_user }}/tokens/argocd"
        method: DELETE
        ca_path: "{{ ca_cert_file }}"
        url_username: "{{ gitea_admin_user }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        status_code: [204, 404]

    - name: Utwórz token (read:repository)
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/users/{{ gitea_admin_user }}/tokens"
        method: POST
        ca_path: "{{ ca_cert_file }}"
        url_username: "{{ gitea_admin_user }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        body_format: json
        body: {name: argocd, scopes: ["read:repository"]}
        status_code: [201]
      register: new_token
      no_log: true

    - name: Zapisz token
      ansible.builtin.copy:
        dest: "{{ secrets_dir }}/gitea-argocd-token"
        content: "{{ new_token.json.sha1 }}"
        mode: "0600"
      no_log: true

    - name: Ustaw token
      ansible.builtin.set_fact:
        argocd_git_token: "{{ new_token.json.sha1 }}"
      no_log: true
